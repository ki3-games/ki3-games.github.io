<!doctype html>
<html style="color-scheme: dark; scrollbar-color: oklch(0.88 0.011 106.6) #0000">
  <head>
    <meta charset="utf-8" />
    <title>Redirecting...</title>
  </head>
  <body style="background-color: oklch(22.8% 0.013 107.4)">
    <script>
      const path = window.location.pathname
      window.location.replace(
        `${window.location.origin}/index.html?url=${encodeURIComponent(path)}`,
      )
    </script>
  </body>
</html>
