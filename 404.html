<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Redirecting...</title>
  </head>
  <body>
    <script>
      const path = window.location.pathname
      window.location.replace(
        `${window.location.origin}/index.html?url=${encodeURIComponent(path)}`,
      )
    </script>
  </body>
</html>
